name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway credentials for the CI-only PostgreSQL service. These are not
  # secrets and grant access to nothing beyond this ephemeral container.
  TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/saans_test
  UV_VERSION: "0.11.21"
  NODE_VERSION: "24"

jobs:
  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend (lint, format, types, security, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saans_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saans_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Format check (Black)
        run: uv run black --check .

      - name: Type check (MyPy)
        run: uv run mypy app

      - name: Security scan (Bandit)
        run: uv run bandit -c pyproject.toml -r app

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repository-size:
    name: Repository size (< 10 MB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tracked repository size
        run: bash scripts/check-repo-size.sh 10
